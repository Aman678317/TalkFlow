name: Realtime LangGraph Control Plane

on:
  pull_request:
    paths:
      - "services/api/app/realtime/realtime_graph.py"
      - "tests/unit/test_realtime_graph.py"
      - "docs/REALTIME_LANGGRAPH_PHASE_PLAN.md"
      - ".github/workflows/realtime-graph.yml"
  push:
    branches:
      - main
      - "feat/langgraph-realtime-control-plane-p1"
    paths:
      - "services/api/app/realtime/realtime_graph.py"
      - "tests/unit/test_realtime_graph.py"
      - ".github/workflows/realtime-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-plane-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install API and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.txt pytest pytest-asyncio greenlet "langgraph>=0.2"
      - name: Test deterministic planner and compiled graph
        env:
          PYTHONPATH: services/api
        run: python -m pytest tests/unit/test_realtime_graph.py -q
