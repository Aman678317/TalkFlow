name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gt
          POSTGRES_PASSWORD: gt
          POSTGRES_DB: gt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gt -d gt_test" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install dependencies
        run: |
          pip install -r apps/api/requirements.txt
          pip install -r services/api/requirements.txt
          pip install greenlet prometheus-client
          pip install ruff
      - name: Lint (ruff, blocking)
        run: ruff check apps/api ai services scripts --select E9,F --ignore F401,F841,F541
      - name: Lint backlog (unused imports, ambiguous names, formatting)
        # Reported on every run but non-blocking; fold into the step above as the
        # repo clears them. Some F401 hits are deliberate re-exports (ai.bootstrap).
        continue-on-error: true
        run: ruff check apps/api ai services scripts --select E,F,W --ignore E501,E402,W505
      - name: Unit + integration tests (SQLite fast lane)
        env:
          APP_ENV: test
          CACHE_BACKEND: memory
          REDIS_URL: ""
          JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789
          RATE_LIMIT_AUTH: 100000/minute
          RATE_LIMIT_TRANSLATE: 100000/minute
        run: python -m pytest tests/unit tests/integration -q
      - name: Hardened suites (flat tests/)
        # These files are where the roadmap's phase-level proof lives, but the
        # lanes above only ever collected tests/unit, tests/integration and
        # tests/realtime, so a hardened test could regress without failing CI.
        # tests/test_realtime_security_hardened.py is deliberately absent: it
        # errors with SQLite "database is locked" on contention (including in
        # isolation) and would make this lane red for reasons unrelated to the
        # change under review. It needs an isolated database per test.
        env:
          APP_ENV: test
          CACHE_BACKEND: memory
          REDIS_URL: ""
          JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789
          RATE_LIMIT_AUTH: 100000/minute
          RATE_LIMIT_TRANSLATE: 100000/minute
        run: |
          python -m pytest \
            tests/test_agent_media_session.py \
            tests/test_agent_runtime_info_hardened.py \
            tests/test_agent_turn_loop.py \
            tests/test_asterisk_ari_adapter.py \
            tests/test_asterisk_ari_inbound.py \
            tests/test_audit_round3_truthfulness.py \
            tests/test_auth_hardened.py \
            tests/test_bridge_seat_routing.py \
            tests/test_call_gate.py \
            tests/test_call_transcript_api.py \
            tests/test_call_worker.py \
            tests/test_contacts_api.py \
            tests/test_database_migrations_hardened.py \
            tests/test_deploy_canonical_provider_tree.py \
            tests/test_dev_entrypoint_contract.py \
            tests/test_developer_platform_hardened.py \
            tests/test_escalation_board_api.py \
            tests/test_escalation_hooks.py \
            tests/test_escalation_transport.py \
            tests/test_entrypoint_provider_resolution.py \
            tests/test_external_media.py \
            tests/test_full_qa_and_e2e_hardened.py \
            tests/test_frontend_api_contract_shapes.py \
            tests/test_glossary_mismatch_note_hardened.py \
            tests/test_history_filters_hardened.py \
            tests/test_media_bridge_hygiene.py \
            tests/test_metering_worker_thresholds_hardened.py \
            tests/test_model_fetch_gates_hardened.py \
            tests/test_observability_and_metrics_hardened.py \
            tests/test_outbound_idempotency.py \
            tests/test_page_translation_hardened.py \
            tests/test_performance_and_load_hardened.py \
            tests/test_private_only_guarantee_hardened.py \
            tests/test_production_readiness_hardened.py \
            tests/test_production_security_hardened.py \
            tests/test_production_telephony_gates.py \
            tests/test_provider_chain_hardened.py \
            tests/test_queue_and_workers_hardened.py \
            tests/test_realtime_pipeline_hardened.py \
            tests/test_realtime_translation_invariant_hardened.py \
            tests/test_retention_escalations.py \
            tests/test_social_auth_hardened.py \
            tests/test_telemetry_tracing_hardened.py \
            tests/test_telephony_ops_admin.py \
            tests/test_telephony_privacy_abuse_gates.py \
            tests/test_telephony_webhook_security.py \
            tests/test_translation_fanout.py \
            tests/test_translation_memory_entries_hardened.py \
            tests/test_usage_billing_units_hardened.py \
            tests/test_ws_media_protocol.py \
            tests/test_ws_media_server.py -q
      - name: Integration tests (PostgreSQL + Redis + pgvector)
        env:
          APP_ENV: test
          CACHE_BACKEND: redis
          DATABASE_URL: postgresql+psycopg://gt:gt@localhost:5432/gt_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789
          RATE_LIMIT_AUTH: 100000/minute
          RATE_LIMIT_TRANSLATE: 100000/minute
        run: |
          pip install psycopg[binary] asyncpg pgvector
          python -m pytest tests/integration -q

  migrations:
    # Roadmap Phase 7 acceptance criteria: `alembic upgrade head` must build a
    # complete, valid schema on fresh PostgreSQL, and production must fail closed
    # when the recorded version is not the migration head. The backend lanes never
    # run Alembic — they boot with APP_ENV=test, where create_all supplies the schema.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gt
          POSTGRES_PASSWORD: gt
          POSTGRES_DB: gt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gt -d gt_test" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install dependencies
        run: |
          pip install -r apps/api/requirements.txt
          pip install -r services/api/requirements.txt
          pip install greenlet prometheus-client psycopg[binary] asyncpg pgvector
      - name: Create empty scratch databases
        run: |
          PGPASSWORD=gt psql -h localhost -U gt -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE gt_api_migrations"
          PGPASSWORD=gt psql -h localhost -U gt -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE gt_legacy_migrations"
      - name: services/api — upgrade head, drift check, full rollback cycle
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+psycopg://gt:gt@localhost:5432/gt_api_migrations
          APP_ENV: test
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: apps/api — upgrade head and drift check on the same engine
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://gt:gt@localhost:5432/gt_legacy_migrations
          APP_ENV: test
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
      - name: Migration hardening suite against PostgreSQL
        env:
          APP_ENV: test
          CACHE_BACKEND: memory
          REDIS_URL: ""
          JWT_SECRET: ci-jwt-secret-0123456789abcdef0123456789
          ALEMBIC_TEST_DATABASE_URL: postgresql+psycopg://gt:gt@localhost:5432/gt_api_migrations
          LEGACY_TEST_DATABASE_URL: postgresql+psycopg://gt:gt@localhost:5432/gt_legacy_migrations
        run: python -m pytest tests/test_database_migrations_hardened.py -q

  realtime-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install dependencies
        run: |
          pip install -r apps/api/requirements.txt
          pip install -r services/api/requirements.txt
          pip install greenlet prometheus-client
      - name: Download CPU model weights
        env:
          MODEL_CACHE_PATH: ${{ runner.temp }}/models
        # STT_SIZE=small matches the server's default stt_model (Systran/faster-whisper-small):
        # #109 class 2 made the request path cache-first, so the golden must find the
        # artifact in the seeded cache instead of downloading it inside the call.
        run: MODEL_PROFILE=CPU STT_SIZE=small bash scripts/download_models.sh
      - name: Golden multilingual call (real STT/MT/TTS over WebSocket)
        env:
          MODEL_CACHE_PATH: ${{ runner.temp }}/models
          APP_ENV: test
          CACHE_BACKEND: memory
          REDIS_URL: ""
          RATE_LIMIT_AUTH: 100000/minute
          RATE_LIMIT_TRANSLATE: 100000/minute
        run: python -m pytest tests/realtime -q -rs
      - name: Verify AI stack report
        env: { MODEL_CACHE_PATH: "${{ runner.temp }}/models" }
        run: python scripts/verify_ai_stack.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Typecheck (strict)
        run: npx tsc -b
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: Build
        run: npx vite build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t globaltalk/api:ci .
      - name: Build Web image
        run: docker build -f infrastructure/docker/Dockerfile.web -t globaltalk/web:ci .
