name: globaltalk-ai
# One command local dev stack:
#   docker compose up -d          (postgres, redis, minio, livekit, api, worker, web)
#   docker compose down
# GPU inference workers: use docker-compose.gpu.yml override (see docs/DEPLOYMENT.md).

x-api-env: &api-env
  APP_ENV: development
  DATABASE_URL: postgresql+asyncpg://globaltalk:globaltalk@postgres:5432/globaltalk
  REDIS_URL: redis://redis:6379/0
  CACHE_BACKEND: redis
  S3_ENABLED: "true"
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: globaltalk
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  LOCAL_STORAGE_PATH: /data/storage
  LIVEKIT_ENABLED: "true"
  LIVEKIT_URL: ws://livekit:7880
  LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
  LIVEKIT_API_KEY: devkey
  LIVEKIT_API_SECRET: devsecret-at-least-32-chars-long!!
  SECRET_KEY: compose-dev-secret
  JWT_SECRET: compose-dev-jwt-secret
  MODEL_CACHE_PATH: /models
  WEB_ORIGIN: http://localhost:5173

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: globaltalk
      POSTGRES_PASSWORD: globaltalk
      POSTGRES_DB: globaltalk
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globaltalk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/globaltalk &&
      mc anonymous set none local/globaltalk &&
      echo 'bucket ready'
      "

  livekit:
    image: livekit/livekit-server:latest
    command: ["--dev", "--bind", "0.0.0.0", "--keys", "devkey: devsecret-at-least-32-chars-long!!"]
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    environment: *api-env
    ports: ["8000:8000"]
    volumes:
      - modelcache:/models
      - apidata:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment: *api-env
    volumes:
      - modelcache:/models
      - apidata:/data
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: ""
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  miniodata:
  modelcache:
  apidata:
