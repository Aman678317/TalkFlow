name: globaltalk-ai
# One command local dev stack:
#   docker compose up -d          (postgres, redis, minio, livekit, api, worker, web)
#   docker compose down
# Pinned to Bitnami legacy MinIO mirror to ensure deterministic cold pulls without Docker Hub auth issues.
# GPU inference workers: use docker-compose.gpu.yml override (see docs/DEPLOYMENT.md).

x-api-env: &api-env
  APP_ENV: development
  DATABASE_URL: postgresql+asyncpg://globaltalk:globaltalk@postgres:5432/globaltalk
  REDIS_URL: redis://redis:6379/0
  CACHE_BACKEND: redis
  S3_ENABLED: "true"
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: globaltalk
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  LOCAL_STORAGE_PATH: /data/storage
  LIVEKIT_ENABLED: "true"
  LIVEKIT_URL: ws://livekit:7880
  LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
  LIVEKIT_API_KEY: devkey
  LIVEKIT_API_SECRET: devsecret-at-least-32-chars-long!!
  SECRET_KEY: compose-dev-secret
  JWT_SECRET: compose-dev-jwt-secret
  MODEL_CACHE_PATH: /models
  WEB_ORIGIN: http://localhost:5173

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: globaltalk
      POSTGRES_PASSWORD: globaltalk
      POSTGRES_DB: globaltalk
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globaltalk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Bitnami legacy mirror of MinIO 2024.6.13 replaces discontinued minio/minio tag
    # which fails anonymous pulls on Docker Hub. Verified in staging rehearsal drill.
    image: bitnamilegacy/minio:2024.6.13
    user: "0"
    entrypoint: ["/opt/bitnami/minio/bin/minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: bitnamilegacy/minio:2024.6.13
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/globaltalk &&
      echo 'bucket ready'
      "

  livekit:
    # Pinned per third_party_components.yaml ("pinned versions only"): v1.13.10
    # is the exact image this repo's e2e stack has validated all along (digest
    # 89ca9ce0…, identical to what `latest` resolved to through the 2026-10-19
    # runs). Floating `latest` here made an unreviewed server release able to
    # silently change CI behavior; bumps go through the manifest re-review.
    image: livekit/livekit-server:v1.13.10
    command: ["--dev", "--bind", "0.0.0.0", "--keys", "devkey: devsecret-at-least-32-chars-long!!"]
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    environment: *api-env
    ports: ["8000:8000"]
    volumes:
      - modelcache:/models
      - apidata:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment: *api-env
    volumes:
      - modelcache:/models
      - apidata:/data
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        # Same-origin through the SPA's nginx proxy (/api, /ws, /health all
        # proxy to api:8000). An empty value would fall back to
        # .env.production's Render URL in prod builds — never ship a compose
        # bundle that dials the hosted deployment.
        VITE_API_BASE_URL: "http://localhost:5173"
        VITE_COPILOTKIT_RUNTIME_URL: "http://localhost:5173/api/copilotkit"
        # Local compose is APP_ENV=development: keep the inject affordance
        # available so the browser E2E can drive the pipeline without a model.
        VITE_E2E_INJECT: "1"
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  miniodata:
  modelcache:
  apidata:
