[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gt-ai-legacy"
version = "0.1.0"
description = "GlobalTalk AI legacy lane: the older provider adapters and the memory guard (the canonical provider layer is services/api/gt_ai)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.3"]
mt = ["transformers>=4.44", "torch>=2.3", "sentencepiece"]
ct2 = ["ctranslate2>=4.3", "transformers>=4.44"]
argos = ["argostranslate>=1.9"]
azure = ["azure-cognitiveservices-speech>=1.41.1"]
tts = ["kokoro-onnx>=0.4", "onnxruntime>=1.18"]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.setuptools.packages.find]
# This distribution ships the legacy lane's OWN modules (the older adapters,
# the memory guard). It used to ship a fork of the provider package as
# "gt_ai" — that fork is retired: services/api/gt_ai is the one provider
# layer (issue #109 class 3).
include = ["ai*"]
