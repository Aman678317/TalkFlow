<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
  <title id="title">TalkFlow real-time pipeline with an optional LangGraph control plane</title>
  <desc id="desc">The current audio path stays unchanged from browser audio through WebSocket, MeetingPipeline, AgentBus, and the four realtime agents. A separate LangGraph planner observes finalized control events and proposes routing decisions without carrying audio bytes or dispatching in Phase 1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="dashArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 30px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .section { font: 700 17px system-ui, -apple-system, Segoe UI, sans-serif; fill: #334155; letter-spacing: .8px; }
      .nodeTitle { font: 700 16px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .nodeText { font: 400 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #334155; }
      .note { font: 500 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .small { font: 500 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #64748b; }
      .flow { stroke: #64748b; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .observer { stroke: #7c3aed; stroke-width: 2.2; stroke-dasharray: 8 7; fill: none; marker-end: url(#dashArrow); }
    </style>
  </defs>
  <rect width="1440" height="840" rx="24" fill="#ffffff"/>
  <text x="64" y="72" class="title">TalkFlow · Realtime + LangGraph</text>
  <text x="64" y="104" class="subtitle">Phase 1 architecture · control plane is optional and does not replace the audio data plane</text>

  <text x="64" y="160" class="section">EXISTING LIVE CALL PATH — UNCHANGED</text>
  <rect x="64" y="188" width="205" height="116" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="166" y="226" text-anchor="middle" class="nodeTitle">Browser / Call UI</text>
  <text x="166" y="251" text-anchor="middle" class="nodeText">Mic + video</text>
  <text x="166" y="272" text-anchor="middle" class="nodeText">PCM16 binary frames</text>

  <path d="M269 246 H313" class="flow"/>
  <rect x="318" y="188" width="190" height="116" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="413" y="226" text-anchor="middle" class="nodeTitle">WebSocket</text>
  <text x="413" y="251" text-anchor="middle" class="nodeText">Auth + session</text>
  <text x="413" y="272" text-anchor="middle" class="nodeText">Replay sequence</text>

  <path d="M508 246 H552" class="flow"/>
  <rect x="557" y="188" width="220" height="116" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="667" y="226" text-anchor="middle" class="nodeTitle">MeetingPipeline</text>
  <text x="667" y="251" text-anchor="middle" class="nodeText">VAD + lifecycle</text>
  <text x="667" y="272" text-anchor="middle" class="nodeText">Routing + fallback</text>

  <path d="M777 246 H821" class="flow"/>
  <rect x="826" y="188" width="180" height="116" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="916" y="226" text-anchor="middle" class="nodeTitle">AgentBus</text>
  <text x="916" y="251" text-anchor="middle" class="nodeText">Bounded events</text>
  <text x="916" y="272" text-anchor="middle" class="nodeText">No raw audio bytes</text>

  <path d="M1006 246 H1035" class="flow"/>
  <rect x="1040" y="174" width="336" height="146" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="1208" y="204" text-anchor="middle" class="nodeTitle">Four existing logical agents</text>
  <rect x="1060" y="222" width="136" height="36" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="1128" y="245" text-anchor="middle" class="nodeText">1 · Listening</text>
  <rect x="1210" y="222" width="146" height="36" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="1283" y="245" text-anchor="middle" class="nodeText">2 · Translation</text>
  <rect x="1060" y="268" width="136" height="36" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="1128" y="291" text-anchor="middle" class="nodeText">3 · Voice / TTS</text>
  <rect x="1210" y="268" width="146" height="36" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="1283" y="291" text-anchor="middle" class="nodeText">4 · Supervisor</text>

  <rect x="64" y="354" width="1312" height="46" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="720" y="382" text-anchor="middle" class="note">Original audio, authentication, video/WebRTC, binary TTS delivery and room lifecycle stay on their current path.</text>

  <text x="64" y="456" class="section">NEW OPTIONAL CONTROL PLANE — PHASE 1 PLANNER ONLY</text>
  <path d="M667 304 V430 H400 V489" class="observer"/>
  <text x="682" y="425" class="small" fill="#7c3aed">final / control events only</text>

  <rect x="64" y="492" width="292" height="134" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="210" y="528" text-anchor="middle" class="nodeTitle">LangGraph StateGraph</text>
  <text x="210" y="552" text-anchor="middle" class="nodeText">Supervisor gate</text>
  <text x="210" y="574" text-anchor="middle" class="nodeText">Typed, serializable state</text>
  <text x="210" y="596" text-anchor="middle" class="nodeText">Optional checkpoint injection</text>

  <path d="M356 559 H402" class="flow"/>
  <rect x="407" y="492" width="410" height="134" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="612" y="528" text-anchor="middle" class="nodeTitle">Control decisions</text>
  <text x="612" y="552" text-anchor="middle" class="nodeText">Final-only translation + target-language dedup</text>
  <text x="612" y="574" text-anchor="middle" class="nodeText">Consent / policy pause · speaker-scoped barge-in</text>
  <text x="612" y="596" text-anchor="middle" class="nodeText">Reconnect replay cursor · safe failure fallback</text>

  <path d="M817 559 H863" class="flow"/>
  <rect x="868" y="492" width="508" height="134" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1122" y="528" text-anchor="middle" class="nodeTitle">Phase 1 output = action proposal</text>
  <text x="1122" y="552" text-anchor="middle" class="nodeText">No provider calls · no database writes · no WebSocket dispatch</text>
  <text x="1122" y="574" text-anchor="middle" class="nodeText">No audio bytes in graph state or checkpoints</text>
  <text x="1122" y="596" text-anchor="middle" class="nodeText">Shadow-test and benchmark before feature-flagged rollout</text>

  <rect x="64" y="672" width="1312" height="90" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="90" y="709" class="nodeTitle">Safety rule</text>
  <text x="90" y="735" class="note">Do not run LangGraph per PCM16 frame or block ordinary speech on human approval. A planner error must fall back to the existing pipeline.</text>
  <text x="90" y="786" class="small">TalkFlow control-plane rollout · documented phases, not a production enablement claim</text>
</svg>
