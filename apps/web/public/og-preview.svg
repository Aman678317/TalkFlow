<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#090d23"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="150" r="220" fill="#4f46e5" opacity="0.22" filter="url(#glow)"/>
  <circle cx="1000" cy="480" r="260" fill="#0284c7" opacity="0.18" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="180" fill="#059669" opacity="0.12" filter="url(#glow)"/>

  <!-- Card Border -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Brand Logo Badge -->
  <g transform="translate(100, 95)">
    <!-- Logo Icon -->
    <circle cx="32" cy="32" r="30" fill="#0f172a" stroke="#4f46e5" stroke-width="2"/>
    <circle cx="32" cy="32" r="21" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <ellipse cx="32" cy="32" rx="9" ry="21" fill="none" stroke="#818cf8" stroke-width="2"/>
    <path d="M11 32h42M14 21h36M14 43h36" stroke="#34d399" stroke-width="2" opacity="0.7"/>

    <!-- App Title -->
    <text x="80" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      GlobalTalk <tspan fill="#818cf8">AI</tspan>
    </text>

    <!-- Badge -->
    <rect x="320" y="16" width="180" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6"/>
    <text x="410" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc" text-anchor="middle">
      ENTERPRISE SUITE
    </text>
  </g>

  <!-- Hero Headline -->
  <g transform="translate(100, 240)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      One conversation.
    </text>
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#accent)" letter-spacing="-1.5">
      Every language.
    </text>
  </g>

  <!-- Subheadline / Value Proposition -->
  <text x="100" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="-0.2">
    Real-Time Multilingual Voice Translation, Document Processing &amp; WebRTC Video Calls.
  </text>
  <text x="100" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#64748b" letter-spacing="-0.2">
    Sub-second latency across 100+ languages with zero data retention and self-hosted privacy.
  </text>

  <!-- Feature Tags / Capabilities Bar -->
  <g transform="translate(100, 480)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="220" height="44" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="110" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">
      🎙️ Live Speech-to-Speech
    </text>

    <!-- Tag 2 -->
    <rect x="235" y="0" width="220" height="44" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="345" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">
      📄 Document Translation
    </text>

    <!-- Tag 3 -->
    <rect x="470" y="0" width="230" height="44" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="585" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">
      📹 Multilingual Meetings
    </text>

    <!-- Tag 4 -->
    <rect x="715" y="0" width="220" height="44" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="825" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">
      ✍️ AI Writing Assistant
    </text>
  </g>

  <!-- Footer Watermark -->
  <text x="1060" y="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#475569" text-anchor="end">
    globaltalk.ai
  </text>
</svg>
