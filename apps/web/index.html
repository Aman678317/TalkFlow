    <!-- Primary SEO Metadata -->
    <title>GlobalTalk AI · Real-Time Multilingual Voice & Text Translation</title>
    <meta name="title" content="GlobalTalk AI · Real-Time Multilingual Voice & Text Translation" />

    <link rel="llms-txt" href="/llms.txt" />
    <meta name="theme-color" content="#0A66C2" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->

    <meta property="og:title" content="GlobalTalk AI: One Conversation, Every Language" />

        {
          "@type": "WebApplication",

          "name": "GlobalTalk AI",
          "url": "https://globaltalk.ai/",
          "description": "Production-ready open-source multilingual AI communication platform offering real-time voice translation, document translation, and bilingual video meetings.",

          "operatingSystem": "Web, Windows, macOS, Linux, iOS, Android",
          "browserRequirements": "Requires WebRTC and JavaScript enabled",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD",
            "availability": "https://schema.org/InStock"
          },
          "featureList": [
            "Real-time speech translation with <1s end-to-end latency",
            "Bilingual face-to-face voice translation",

            "LiveKit WebRTC video meetings with per-participant translated audio",

          "creator": {
            "@id": "https://globaltalk.ai/#organization"
          }

          "@type": "Organization",

          "@id": "https://globaltalk.ai/#website",
          "url": "https://globaltalk.ai/",
          "name": "GlobalTalk AI",
          "publisher": {
            "@id": "https://globaltalk.ai/#organization"
          }
        }
