<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TalkFlow Meet Translator</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #1e1f22;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #007aff, #00c6ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }
    h1 {
      font-size: 14px;
      margin: 0;
      font-weight: 600;
    }
    .status-pill {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      margin-left: auto;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: 500;
    }
    select, input[type="text"] {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #ffffff;
      padding: 7px 10px;
      font-size: 12px;
      box-sizing: border-box;
      outline: none;
    }
    select:focus, input[type="text"]:focus {
      border-color: #007aff;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 12px;
    }
    .btn {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: none;
      background: #007aff;
      color: white;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      margin-top: 14px;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #0062cc;
    }
    .btn.active {
      background: #ef4444;
    }
    .info-tip {
      font-size: 10px;
      color: #64748b;
      margin-top: 8px;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">TF</div>
    <div>
      <h1>TalkFlow Live</h1>
      <span style="font-size: 10px; color: #94a3b8;">Google Meet Translation</span>
    </div>
    <span class="status-pill" id="statusBadge">Ready</span>
  </div>

  <div class="form-group">
    <label for="speakLang">Speaker Language</label>
    <select id="speakLang">
      <option value="auto" selected>Auto-detect (100+ languages)</option>
      <option value="en">English</option>
      <option value="es">Spanish (Español)</option>
      <option value="fr">French (Français)</option>
      <option value="de">German (Deutsch)</option>
      <option value="hi">Hindi (हिन्दी)</option>
      <option value="ja">Japanese (日本語)</option>
      <option value="zh">Chinese (中文)</option>
      <option value="pt">Portuguese (Português)</option>
      <option value="ru">Russian (Русский)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="hearLang">My Target Language (Translate To)</label>
    <select id="hearLang">
      <option value="en" selected>English</option>
      <option value="es">Spanish (Español)</option>
      <option value="hi">Hindi (हिन्दी)</option>
      <option value="fr">French (Français)</option>
      <option value="de">German (Deutsch)</option>
      <option value="ja">Japanese (日本語)</option>
      <option value="zh">Chinese (中文)</option>
      <option value="pt">Portuguese (Português)</option>
      <option value="ru">Russian (Русский)</option>
      <option value="ar">Arabic (العربية)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="captionStyle">Subtitle Display Mode</label>
    <select id="captionStyle">
      <option value="both" selected>Bilingual Dual Subtitles (Original + Translated)</option>
      <option value="translated">Translated Subtitles Only</option>
      <option value="original">Original Subtitles Only</option>
    </select>
  </div>

  <div class="toggle-row">
    <span>AI Voice Interpretation</span>
    <input type="checkbox" id="voiceInterpretation" checked>
  </div>

  <button class="btn" id="toggleBtn">Start Live Translation</button>

  <div class="info-tip">
    TalkFlow displays floating translated subtitles &amp; plays neural voice interpretation directly inside Google Meet.
  </div>

  <script src="popup.js"></script>
</body>
</html>
