[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api", "apps/api", "ai", "."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*starlette.testclient.*",
    "ignore:.*httpx.*:Warning",
]
asyncio_mode = "auto"
markers = ["model: tests that require downloaded AI model weights", "realtime: end-to-end realtime golden call test"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pyrefly]
search_path = ["services/api", "apps/api", "ai", "."]
extraPaths = ["services/api", "apps/api", "ai", "."]
project_excludes = ["gt_ai/**"]

[tool.pyright]
extraPaths = ["services/api", "apps/api", "ai", "."]

