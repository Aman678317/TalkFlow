; Local-only SIP endpoints for the Asterisk development lab.
; Change both passwords before any use beyond an isolated local machine.
; Do not forward these ports to the public Internet.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[7001]
type=endpoint
context=local-lab
disallow=all
allow=ulaw,alaw
auth=7001-auth
aors=7001
direct_media=no

[7001-auth]
type=auth
auth_type=userpass
username=7001
password=CHANGE-ME-7001

[7001]
type=aor
max_contacts=1
remove_existing=yes

[7002]
type=endpoint
context=local-lab
disallow=all
allow=ulaw,alaw
auth=7002-auth
aors=7002
direct_media=no

[7002-auth]
type=auth
auth_type=userpass
username=7002
password=CHANGE-ME-7002

[7002]
type=aor
max_contacts=1
remove_existing=yes
