server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # security headers (section 39)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API + realtime reverse proxy (WS upgrade aware)
  location /api/    { proxy_pass http://api:8000; proxy_set_header Host $host;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme; }
  location /ws/     { proxy_pass http://api:8000;
                      proxy_http_version 1.1;
                      proxy_set_header Upgrade $http_upgrade;
                      proxy_set_header Connection "upgrade";
                      proxy_read_timeout 3600s; proxy_send_timeout 3600s; }
  location /health  { proxy_pass http://api:8000; }
  location /ready   { proxy_pass http://api:8000; }
  location /version { proxy_pass http://api:8000; }
  location /metrics { proxy_pass http://api:8000; }
  location /internal/ { proxy_pass http://api:8000; }
  location /docs    { proxy_pass http://api:8000; }
  location /openapi.json { proxy_pass http://api:8000; }

  # SPA fallback
  location / { try_files $uri $uri/ /index.html; }
}
