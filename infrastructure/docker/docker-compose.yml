# GlobalTalk AI — full local topology (section 85)
# docker compose -f infrastructure/docker/docker-compose.yml up
#
# Heavy GPU inference runs in separate worker profiles; the API container never
# runs model inference inline in production (queue → workers).

name: globaltalk

x-api-env: &api-env
  APP_ENV: development
  DATABASE_URL: postgresql+asyncpg://globaltalk:globaltalk@postgres:5432/globaltalk
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: globaltalk
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  LIVEKIT_URL: ws://livekit:7880
  LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
  LIVEKIT_API_KEY: devkey
  LIVEKIT_API_SECRET: secretsecretsecretsecretsecretse
  MODEL_CACHE_PATH: /models
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-0123456789abcdef}
  SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-0123456789abcdef}
  CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:8080,http://localhost:3000
  METRICS_ENABLED: "true"

services:
  postgres:
    image: pgvector/pgvector:pg16          # PostgreSQL + pgvector (section 77.8)
    environment:
      POSTGRES_USER: globaltalk
      POSTGRES_PASSWORD: globaltalk
      POSTGRES_DB: globaltalk
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globaltalk"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s

  minio-init:
    image: minio/mc
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/globaltalk || true"

  livekit:
    image: livekit/livekit-server:v1.7.2   # pinned (section 82)
    command: ["--dev", "--bind", "0.0.0.0", "--keys", "devkey: secretsecretsecretsecretsecretse"]
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 10s
      retries: 5

  api:
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile.api }
    environment: *api-env
    volumes:
      - model-cache:/models
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  worker:
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile.api }
    environment: *api-env
    volumes: [model-cache:/models]
    depends_on:
      api: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: python -m app.workers_runner          # document/webhook/cleanup/metering queues

  # GPU inference workers (profile "gpu"): dedicated, autoscaled in k8s
  inference-worker:
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile.api }
    profiles: [gpu]
    environment:
      <<: *api-env
      STT_DEVICE: cuda
      STT_COMPUTE_TYPE: float16
    volumes: [model-cache:/models]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    command: python -m globaltalk.workers.run --tasks stt,mt,tts

  web:
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile.web }
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
  miniodata:
  model-cache:
