# GlobalTalk AI — Kubernetes manifests (production shape)
# Control plane (api), data plane (realtime workers), inference plane (GPU) scale
# independently (sections 58/59). Apply with: kubectl apply -k infrastructure/kubernetes
apiVersion: v1
kind: Namespace
metadata:
  name: globaltalk
---
apiVersion: v1
kind: Secret
metadata:
  name: globaltalk-secrets
  namespace: globaltalk
type: Opaque
stringData:
  # REPLACE in real deployments (External Secrets / Sealed Secrets / Vault)
  DATABASE_URL: postgresql+psycopg://globaltalk:CHANGE_ME@postgres:5432/globaltalk
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: CHANGE_ME_32+_BYTES_RANDOM
  SECRET_KEY: CHANGE_ME_32+_BYTES_RANDOM
  S3_ACCESS_KEY: CHANGE_ME
  S3_SECRET_KEY: CHANGE_ME
  LIVEKIT_API_KEY: CHANGE_ME
  LIVEKIT_API_SECRET: CHANGE_ME
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: globaltalk-config
  namespace: globaltalk
data:
  APP_ENV: production
  DB_AUTOCREATE: "false"
  STORAGE_BACKEND: s3
  S3_BUCKET: globaltalk
  S3_ENDPOINT: https://s3.internal
  LIVEKIT_URL: wss://livekit.globaltalk.example
  MODEL_CACHE_PATH: /models
  STT_MODEL: Systran/faster-whisper-large-v3
  STT_DEVICE: cuda
  STT_COMPUTE_TYPE: float16
  TRANSLATION_PROVIDER: auto
  TTS_PROVIDER: auto
  LLM_PROVIDER: vllm
  VLLM_BASE_URL: http://vllm:8000
  VLLM_MODEL: meta-llama/Llama-3.1-8B-Instruct
  VAD_PROVIDER: silero
  PROMETHEUS_ENABLED: "true"
  OTEL_ENDPOINT: http://otel-collector:4317
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: globaltalk
spec:
  accessModes: [ReadWriteMany]   # shared warm model cache across inference pods
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: globaltalk-migrate
  namespace: globaltalk
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: globaltalk/api:0.1.0
          command: ["python", "-m", "alembic", "upgrade", "head"]
          workingDir: /app/apps/api
          envFrom:
            - secretRef: { name: globaltalk-secrets }
            - configMapRef: { name: globaltalk-config }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api            # CONTROL PLANE + WS data plane
  namespace: globaltalk
spec:
  replicas: 3
  selector: { matchLabels: { app: globaltalk-api } }
  template:
    metadata:
      labels: { app: globaltalk-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: globaltalk/api:0.1.0
          ports: [{ containerPort: 8000 }]
          envFrom:
            - secretRef: { name: globaltalk-secrets }
            - configMapRef: { name: globaltalk-config }
          volumeMounts: [{ name: models, mountPath: /models }]
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { cpu: "2", memory: 3Gi }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: model-cache }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: globaltalk }
spec:
  selector: { app: globaltalk-api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: globaltalk }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker         # document/webhook/cleanup/metering queues
  namespace: globaltalk
spec:
  replicas: 2
  selector: { matchLabels: { app: globaltalk-worker } }
  template:
    metadata: { labels: { app: globaltalk-worker } }
    spec:
      containers:
        - name: worker
          image: globaltalk/api:0.1.0
          command: ["python", "-m", "globaltalk.workers.run"]
          workingDir: /app/apps/api
          envFrom:
            - secretRef: { name: globaltalk-secrets }
            - configMapRef: { name: globaltalk-config }
          volumeMounts: [{ name: models, mountPath: /models }]
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: model-cache }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gpu  # AI INFERENCE PLANE (STT/MT/TTS/LLM workers on GPU)
  namespace: globaltalk
spec:
  replicas: 1
  selector: { matchLabels: { app: globaltalk-inference } }
  template:
    metadata: { labels: { app: globaltalk-inference } }
    spec:
      containers:
        - name: inference
          image: globaltalk/inference-gpu:0.1.0   # built with CUDA wheels + warm pools
          command: ["python", "-m", "globaltalk.workers.run", "--tasks", "stt,mt,tts"]
          workingDir: /app/apps/api
          envFrom:
            - secretRef: { name: globaltalk-secrets }
            - configMapRef: { name: globaltalk-config }
          volumeMounts: [{ name: models, mountPath: /models }]
          resources:
            requests: { nvidia.com/gpu: "1", memory: 8Gi }
            limits: { nvidia.com/gpu: "1", memory: 20Gi }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: model-cache }
      nodeSelector: { globaltalk.ai/gpu: "true" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: globaltalk }
spec:
  replicas: 2
  selector: { matchLabels: { app: globaltalk-web } }
  template:
    metadata: { labels: { app: globaltalk-web } }
    spec:
      containers:
        - name: web
          image: globaltalk/web:0.1.0
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: globaltalk }
spec:
  selector: { app: globaltalk-web }
  ports: [{ port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: globaltalk
  namespace: globaltalk
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.globaltalk.example]
      secretName: globaltalk-tls
  rules:
    - host: app.globaltalk.example
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { number: 80 } } } }
          - { path: /ws, pathType: Prefix, backend: { service: { name: api, port: { number: 80 } } } }
          - { path: /health, pathType: Prefix, backend: { service: { name: api, port: { number: 80 } } } }
          - { path: /ready, pathType: Prefix, backend: { service: { name: api, port: { number: 80 } } } }
          - { path: /metrics, pathType: Prefix, backend: { service: { name: api, port: { number: 80 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
