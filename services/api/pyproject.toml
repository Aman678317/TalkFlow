[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "globaltalk-api"
version = "0.1.0"
description = "GlobalTalk AI control plane + realtime data plane (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "redis>=5.0",
    "email-validator>=2.1",
    "orjson>=3.10",
    "prometheus-client>=0.20",
    "python-dateutil>=2.9",
    "gt-ai",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
docs = ["pypdf>=4.2", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=0.6.23"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25", "opentelemetry-instrumentation-fastapi>=0.46b0"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
