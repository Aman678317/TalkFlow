version: "3.8"

services:
  audio-intelligence-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talkflow-audio-intelligence-agent
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - AGENT_NAME=audio_intelligence_agent
      - AGENT_VERSION=1.0.0
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - AUDIO_SAMPLE_RATE=16000
      - VAD_PROVIDER=silero
      - NOISE_SUPPRESSION_PROVIDER=spectral
      - LLM_AGENT_ENABLED=true
      - LLM_PROVIDER=ollama
      - LLM_MODEL=qwen3.5:4b
      - LLM_BASE_URL=http://ollama:11434/v1
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ./temp_audio:/app/temp_audio

  ollama:
    image: ollama/ollama:latest
    container_name: talkflow-ollama-brain
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:

