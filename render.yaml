services:
  # GlobalTalk AI — API & Real-time Web Service on Render
  - type: web
    name: globaltalk-api
    runtime: python
    region: oregon
    plan: starter
    branch: main
    rootDir: services/api
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      # app.config rejects production startup without a strong SECRET_KEY
      # (>=32 chars, non-default) — generate it in the Blueprint itself.
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Reference the managed Render Redis URL using supported Blueprint syntax.
      - key: REDIS_URL
        fromService:
          type: redis
          name: globaltalk-cache
          property: connectionString
      - key: CORS_ORIGINS
        value: https://globaltalk-ai.vercel.app,https://feat-vercel-multi-service.vercel.app,http://localhost:5173
      - key: TRANSLATION_PROVIDER
        value: auto
      - key: STT_PROVIDER
        value: auto
      - key: TTS_PROVIDER
        value: auto
      - key: LANG_DETECT_PROVIDER
        value: auto
      - key: CACHE_BACKEND
        value: auto
      # Production config requires METRICS_TOKEN whenever metrics are enabled.
      # Keep the endpoint disabled until a token is deliberately configured.
      - key: METRICS_ENABLED
        value: "false"

databases: []
