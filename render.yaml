services:
  # GlobalTalk AI — API & Real-time Web Service on Render
  - type: web
    name: globaltalk-api
    runtime: python
    region: oregon
    plan: starter
    branch: main
    rootDir: services/api
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://globaltalk-ai.vercel.app,http://localhost:5173
      - key: TRANSLATION_PROVIDER
        value: auto
      - key: STT_PROVIDER
        value: auto
      - key: TTS_PROVIDER
        value: auto
      - key: LANG_DETECT_PROVIDER
        value: auto
      - key: CACHE_BACKEND
        value: memory
